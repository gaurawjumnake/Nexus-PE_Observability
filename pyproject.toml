[project]
name = "ai-observability-tower"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109.1",
    "boto3>=1.43.36",
    "chromadb>=1.0.0",
    "crewai[azure-ai-inference]>=1.14.7",
    "fastapi>=0.137.0",
    "google-genai>=2.8.0",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "mangum>=0.19.0",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0.50",
    "unstructured[docx,md,pptx,xlsx]>=0.22.18",
    "pdfminer.six>=20231228",
    "uvicorn>=0.49.0",
    "docling>=2.95.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
