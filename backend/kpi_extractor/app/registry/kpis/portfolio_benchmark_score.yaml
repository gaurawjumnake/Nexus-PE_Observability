name: Portfolio Benchmark Score
category: Benchmarking
tier: executive
description: Nexus AI maturity score relative to industry-matched PE firm benchmarks,
  expressed as a percentile.
business_value: Provides LP-facing evidence of portfolio's AI leadership relative
  to peers.
formula: percentile_rank(portfolio_avg_maturity_score, benchmark_distribution)
unit: percentile
aggregation: latest_value
frequency: quarterly
required_facts:
- portfolio_avg_maturity_score
- benchmark_distribution
derived_facts: []
required_documents:
- benchmark
- board_deck
dependencies:
- portfolio_avg_maturity_score
benchmarking:
  enabled: true
  benchmark_type: industry
  benchmark_source: pe_benchmark_panel
thresholds:
  excellent: 90
  good: 75
  warning: 50
  critical: 25
data_quality:
  minimum_coverage: 70
  confidence_threshold: 0.8
missing_data_strategy: use_last_known
owner_persona:
- cxo
dashboard_visibility:
- executive_dashboard
- benchmark_dashboard
example_calculation: portfolio score=3.9x ROI vs industry median=2.4x => Top 15%
status: active
kpi_id: portfolio_benchmark_score
