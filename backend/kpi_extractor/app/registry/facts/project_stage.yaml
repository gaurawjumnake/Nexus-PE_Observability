fact_id: project_stage
name: Project Stage
category: project
description: Current pipeline stage of an AI project (e.g., poc, pilot, production, stalled, deprioritized).
business_definition: A categorical label indicating where in the delivery lifecycle an AI project currently
  sits, used to compute project portfolio KPIs such as production ratio and stalled project counts.
